<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis Reportes — SCSM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<!-- ────────────────────────── LOGIN ────────────────────────── -->
<div id="loginWrap" class="login-wrap">
  <div class="login-card">
    <div class="login-logo" aria-label="SCSM Portal">
      <svg viewBox="0 0 40 40" width="40" height="40" fill="none" aria-hidden="true">
        <rect x="4" y="4" width="32" height="32" rx="8" stroke="currentColor" stroke-width="2.5"/>
        <path d="M13 20h14M20 13v14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="4" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>Portal SCSM</span>
    </div>
    <h1 class="login-title">Mis Reportes</h1>
    <p class="login-sub">Inicia sesión con tu cuenta institucional</p>
    <div id="loginErr" class="login-err"></div>
    <div class="field">
      <label for="inDom">Dominio</label>
      <select id="inDom">
        <option value="CJF">CJF</option>
        <option value="OAJ">OAJ</option>
        <option value="TDJ">TDJ</option>
      </select>
    </div>
    <div class="field">
      <label for="inUser">Usuario</label>
      <input id="inUser" type="text" placeholder="usuario.nombre" autocomplete="username" spellcheck="false">
    </div>
    <div class="field">
      <label for="inPass">Contraseña</label>
      <input id="inPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button id="btnLogin" class="btn-primary" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- ────────────────────────── APP ────────────────────────── -->
<div id="app" class="hidden">

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <svg viewBox="0 0 40 40" width="28" height="28" fill="none" aria-hidden="true" style="color:var(--primary)">
        <rect x="4" y="4" width="32" height="32" rx="8" stroke="currentColor" stroke-width="2.5"/>
        <path d="M13 20h14M20 13v14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="4" stroke="currentColor" stroke-width="2"/>
      </svg>
      <h1 class="app-title">Mis Reportes</h1>
    </div>
    <div class="header-right">
      <span id="userBadge" class="user-badge"></span>
      <button data-theme-toggle aria-label="Cambiar tema" class="icon-btn"></button>
      <button class="btn-ghost" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </header>

  <!-- Flash -->
  <div id="flash" class="flash"></div>

  <!-- KPIs -->
  <section class="kpi-section" aria-label="Resumen">
    <button class="kpi-card" onclick="kpiClick('all')" title="Ver todos">
      <div class="kpi-label">Total</div>
      <div class="kpi-num" id="kpiTotal">–</div>
    </button>
    <button class="kpi-card warn" onclick="kpiClick('abierto')" title="Filtrar abiertos">
      <div class="kpi-label">Abierto</div>
      <div class="kpi-num" id="kpiAbierto">–</div>
    </button>
    <button class="kpi-card orange" onclick="kpiClick('pendiente')" title="Filtrar pendientes">
      <div class="kpi-label">Pendiente</div>
      <div class="kpi-num" id="kpiPendiente">–</div>
    </button>
    <button class="kpi-card blue" onclick="kpiClick('enprogreso')" title="Filtrar en progreso">
      <div class="kpi-label">En Progreso</div>
      <div class="kpi-num" id="kpiEnProg">–</div>
    </button>
    <button class="kpi-card ok" onclick="kpiClick('resuelto')" title="Filtrar resueltos">
      <div class="kpi-label">Resuelto</div>
      <div class="kpi-num" id="kpiResuelto">–</div>
    </button>
    <button class="kpi-card gray" onclick="kpiClick('cerrado')" title="Filtrar cerrados/cancelados">
      <div class="kpi-label">Cerrado</div>
      <div class="kpi-num" id="kpiCerrado">–</div>
    </button>
    <button class="kpi-card inc" onclick="kpiClick('all'); setTab('Incidente', document.getElementById('tabInc'))" title="Solo incidentes">
      <div class="kpi-label">Incidentes</div>
      <div class="kpi-num" id="kpiInc">–</div>
    </button>
    <button class="kpi-card sol" onclick="kpiClick('all'); setTab('Solicitud', document.getElementById('tabSol'))" title="Solo solicitudes">
      <div class="kpi-label">Solicitudes</div>
      <div class="kpi-num" id="kpiSol">–</div>
    </button>
  </section>

  <!-- Tabla -->
  <main class="table-section">

    <!-- Fila 1: Tabs tipo + búsqueda + refresh -->
    <div class="toolbar-top">
      <div class="tabs" role="tablist">
        <button id="tabAll" class="tab active" role="tab" onclick="setTab('all', this)">Todos</button>
        <button id="tabInc" class="tab"         role="tab" onclick="setTab('Incidente', this)">Incidentes</button>
        <button id="tabSol" class="tab"         role="tab" onclick="setTab('Solicitud', this)">Solicitudes</button>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m14 14 3 3" stroke-linecap="round"/></svg>
        <input id="searchBox" type="search" placeholder="Buscar por ID, título, estado…"
               oninput="setQuery(this.value)" aria-label="Buscar reportes">
      </div>
      <button class="icon-btn" onclick="loadData()" aria-label="Actualizar datos" title="Actualizar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      </button>
    </div>

    <!-- Fila 2: Filtros de estado dinámicos -->
    <div id="statusTabs" class="status-tabs" role="tablist" aria-label="Filtrar por estado"></div>

    <!-- Bulk bar -->
    <div id="bulkBar" class="bulk-bar hidden">
      <span id="bulkCount" class="bulk-count"></span>
      <select id="bulkAction" class="bulk-select">
        <option value="">— Acción —</option>
        <option value="close">Cerrar seleccionados</option>
        <option value="comentar">Comentar seleccionados</option>
      </select>
      <textarea id="bulkComment" class="bulk-textarea hidden" placeholder="Comentario para todos…" rows="2"></textarea>
      <button class="btn-primary btn-sm" onclick="doBulkAction()">Aplicar</button>
      <button class="btn-ghost btn-sm" onclick="clearSelection()">Cancelar</button>
    </div>

    <!-- Tabla -->
    <div class="table-wrap" role="region" aria-label="Lista de reportes">
      <table>
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="checkAll" onchange="toggleAll(this)" aria-label="Seleccionar todos"></th>
            <th>ID</th>
            <th>Título / Usuario</th>
            <th>Estado</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="tableLoading" class="table-loading hidden">
        <div class="spinner"></div><span>Cargando reportes…</span>
      </div>
      <div id="tableEmpty" class="table-empty hidden">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 17H7A5 5 0 0 1 7 7h1M15 7h1a5 5 0 0 1 0 10h-1M8 12h8"/></svg>
        <p>Sin reportes para este filtro.</p>
      </div>
    </div>
  </main>
</div>

<!-- ────────────────────────── DRAWER ────────────────────────── -->
<div id="overlay" class="overlay" onclick="closeDrawer()"></div>
<aside id="drawer" class="drawer" aria-label="Detalle de reporte">
  <div class="drawer-head">
    <div>
      <div id="dId" class="d-id"></div>
      <div id="dTitle" class="d-title"></div>
    </div>
    <button class="icon-btn" onclick="closeDrawer()" aria-label="Cerrar detalle">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div id="drawerLoading" class="drawer-loading">
    <div class="spinner"></div><span>Cargando…</span>
  </div>

  <div id="drawerContent" class="drawer-body hidden">
    <!-- Meta -->
    <div class="d-meta-grid">
      <div class="d-meta-item"><span class="d-meta-label">Estado</span><span id="dEstado"></span></div>
      <div class="d-meta-item"><span class="d-meta-label">Tipo</span><span id="dTipo" class="d-meta-val"></span></div>
      <div class="d-meta-item"><span class="d-meta-label">Prioridad</span><span id="dPrio" class="d-meta-val"></span></div>
      <div class="d-meta-item"><span class="d-meta-label">Adscripción</span><span id="dClase" class="d-meta-val"></span></div>
      <div class="d-meta-item"><span class="d-meta-label">Creado</span><span id="dCreado" class="d-meta-val"></span></div>
      <div class="d-meta-item"><span class="d-meta-label">Asignado a</span><span id="dAsig" class="d-meta-val"></span></div>
      <div class="d-meta-item"><span class="d-meta-label">Usuario afectado</span><span id="dAfectado" class="d-meta-val"></span></div>
    </div>
    <!-- Descripción -->
    <div class="d-section">
      <h3 class="d-section-title">Descripción</h3>
      <p id="dDesc" class="d-desc"></p>
    </div>
    <!-- Actividades -->
    <div class="d-section">
      <h3 class="d-section-title">Actividades</h3>
      <div id="dActividades" class="timeline"></div>
    </div>
    <!-- Acciones -->
    <div id="drawerActions" class="d-section">
      <h3 class="d-section-title">Acciones</h3>
      <textarea id="dComment" class="d-textarea" placeholder="Escribe un comentario…" rows="3"></textarea>
      <div class="d-action-row">
        <button class="btn-primary btn-sm" onclick="doComment()">Comentar</button>
        <button class="btn-warn btn-sm"    onclick="doAction('resolve')">Marcar resuelto</button>
        <button class="btn-danger btn-sm"  onclick="doAction('close')">Cerrar reporte</button>
      </div>
    </div>
  </div>
</aside>

<script src="/static/js/app.js" defer></script>
</body>
</html>
