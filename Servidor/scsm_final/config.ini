; ============================================================================
; config.ini — Portal SCSM
; Coloca este archivo junto a scsm_server_portal.py
; ============================================================================

; --- Dominio CJF (por defecto) ---
[ldap]
server      = CJFDC01366.cjf.gob.mx
port        = 389
domain      = CJF
search_base = DC=cjf,DC=gob,DC=mx

; --- Dominio OAJ ---
[ldap_oaj]
server      = OAJDC01.oaj.gob.mx
port        = 389
domain      = OAJ
search_base = DC=oaj,DC=gob,DC=mx

; --- Dominio TDJ ---
[ldap_tdj]
server      = TDJDC01.tdj.gob.mx
port        = 389
domain      = TDJ
search_base = DC=tdj,DC=gob,DC=mx

; --- SASI (fuente de datos de incidentes y solicitudes) ---
; NOTA: el portal hace login en login_url y luego consulta directamente
; el endpoint real de datos: includes/tablas/getTblarepper.php
; (sm_url se conserva solo de referencia, ya no se usa como API)
[sasi]
login_url = http://10.2.171.6/sasi/app/login.php
sm_url    = http://10.2.171.6/sasi/sm.php
; Usuario y contraseña de la cuenta de SERVICIO que usa el portal para consultar SASI
; (no es el usuario que inicia sesión en el portal, sino la cuenta del servidor)
user      = acorreab
password  = Frank*1202*
domain    = cjf
; Tiempo máximo de espera por respuesta de SASI (segundos)
timeout   = 60
