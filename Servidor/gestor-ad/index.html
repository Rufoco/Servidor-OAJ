<!DOCTYPE html>
<html lang='es' data-theme='dark'>
<head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Gestor AD — CJF / OAJ / TDJ</title>
<link rel='manifest' href='/gestor-ad/manifest.json'>
<meta name='theme-color' content='#4f8ef7'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-title' content='Gestor AD'>
<style>
:root{--bg:#0f1117;--surface:#181c24;--surface2:#1e2330;--border:#2a2f3d;--text:#e2e6f0;--muted:#8891a8;--faint:#4a5168;--primary:#4f8ef7;--primary-h:#3a7aed;--primary-hl:rgba(79,142,247,.13);--success:#3ecf8e;--success-hl:rgba(62,207,142,.13);--warn:#f59e0b;--warn-hl:rgba(245,158,11,.13);--error:#f56565;--error-hl:rgba(245,101,101,.13);--r:8px;--rl:14px;--sh:0 4px 24px rgba(0,0,0,.45);--t:160ms cubic-bezier(.16,1,.3,1)}
[data-theme=light]{--bg:#f5f6fa;--surface:#fff;--surface2:#f0f2f7;--border:#dde1ed;--text:#1a1f2e;--muted:#5a637a;--faint:#a0a8be;--primary:#2563eb;--primary-h:#1d4ed8;--primary-hl:rgba(37,99,235,.1);--success:#059669;--success-hl:rgba(5,150,105,.1);--warn:#d97706;--warn-hl:rgba(217,119,6,.1);--error:#dc2626;--error-hl:rgba(220,38,38,.1);--sh:0 4px 24px rgba(0,0,0,.1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input{font:inherit;color:inherit;background:none}
button,input{transition:background var(--t),color var(--t),border-color var(--t),box-shadow var(--t)}

/* ── Login overlay ── */
#lo{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:36px 40px;width:100%;max-width:380px;box-shadow:var(--sh)}
.llogo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.llogo-txt h1{font-size:17px;font-weight:700;line-height:1.2}
.llogo-txt p{font-size:12px;color:var(--muted);margin-top:2px}
.dtabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--surface2);border-radius:var(--r);padding:4px;margin-bottom:20px}
.dtab{padding:8px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;transition:background var(--t),color var(--t)}
.dtab.on[data-d=cjf]{background:#4f8ef7;color:#fff}
.dtab.on[data-d=oaj]{background:#3ecf8e;color:#fff}
.dtab.on[data-d=tdj]{background:#a86fdf;color:#fff}
.lf{margin-bottom:14px}
.lf label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.li{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);font-size:14px;outline:none}
.li:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-hl)}
.lbtn{width:100%;padding:11px;background:var(--primary);color:#fff;border-radius:var(--r);font-size:14px;font-weight:600;margin-top:6px}
.lbtn:hover{background:var(--primary-h)}
.lbtn:disabled{opacity:.6;cursor:not-allowed}
.lerr{background:var(--error-hl);border:1px solid var(--error);color:var(--error);border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
.pwrap{position:relative}
.pwrap .li,.pwrap .mi{padding-right:38px}
.ptgl{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ptgl:hover{color:var(--text)}

/* ── App ── */
#app{display:none;flex-direction:column;min-height:100dvh}
.hdr{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100}
.hlogo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;flex:1}
.husr{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:5px 11px;font-size:13px}
.udot{width:8px;height:8px;border-radius:50%;background:#3ecf8e;flex-shrink:0}
.blout{padding:5px 10px;background:var(--error-hl);border:1px solid var(--error);color:var(--error);border-radius:var(--r);font-size:12px;font-weight:600}
.blout:hover{background:var(--error);color:#fff}
.btheme{padding:6px;border-radius:var(--r);color:var(--muted)}
.btheme:hover{background:var(--surface2);color:var(--text)}

.main{display:flex;flex:1;overflow:hidden}
.sb{width:300px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
.sbs{padding:14px 16px}
.sbs+.sbs{border-top:1px solid var(--border)}
.slbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px}

.dtabs2{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--surface2);border-radius:var(--r);padding:3px}
.dtab2{padding:7px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;transition:background var(--t),color var(--t)}
.dtab2.on[data-d=cjf]{background:#4f8ef7;color:#fff}
.dtab2.on[data-d=oaj]{background:#3ecf8e;color:#fff}
.dtab2.on[data-d=tdj]{background:#a86fdf;color:#fff}

.swrap{position:relative;margin-top:10px}
.swrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:15px;height:15px;pointer-events:none}
.si{width:100%;padding:9px 12px 9px 32px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);font-size:14px;outline:none;color:var(--text)}
.si:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-hl)}
.bbus{width:100%;margin-top:8px;padding:9px;background:var(--primary);color:#fff;border-radius:var(--r);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.bbus:hover{background:var(--primary-h)}
.bbus:disabled{opacity:.6;cursor:not-allowed}

.reclist{display:flex;flex-wrap:wrap;gap:6px}
.crec{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.crec:hover{border-color:var(--primary);color:var(--primary)}
.cdom{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.cdom.cjf{background:rgba(79,142,247,.2);color:#4f8ef7}
.cdom.oaj{background:rgba(62,207,142,.2);color:#3ecf8e}
.cdom.tdj{background:rgba(168,109,223,.2);color:#a86fdf}

.rlist{flex:1;overflow-y:auto;padding:8px}
.ri{padding:10px 12px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:background var(--t),border-color var(--t)}
.ri:hover{background:var(--surface2)}
.ri.on{background:var(--primary-hl);border-color:var(--primary)}
.ri-n{font-size:13px;font-weight:600}
.ri-u{font-size:12px;color:var(--muted);margin-top:2px}
.ri-b{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}

.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.bok{background:var(--success-hl);color:var(--success)}
.boff{background:var(--error-hl);color:var(--error)}
.bwrn{background:var(--warn-hl);color:var(--warn)}
.bmut{background:var(--surface2);color:var(--muted)}

.dp{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:12px;text-align:center;min-height:300px}

.ucard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.uch{padding:20px 24px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px}
.uav{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
.uav.cjf{background:rgba(79,142,247,.15);color:#4f8ef7}
.uav.oaj{background:rgba(62,207,142,.15);color:#3ecf8e}
.uav.tdj{background:rgba(168,109,223,.15);color:#a86fdf}
.uim h2{font-size:17px;font-weight:700;line-height:1.2}
.uim p{font-size:13px;color:var(--muted);margin-top:3px}
.ucb{padding:20px 24px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.df label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.df .dv{font-size:13px;margin-top:4px;word-break:break-word}
.df .dv.em{color:var(--faint);font-style:italic}
.strow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 24px;border-top:1px solid var(--border)}
.stbadge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.stbadge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}

.acard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px 24px}
.atit{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:14px;letter-spacing:.4px;text-transform:uppercase}
.agrid{display:flex;flex-wrap:wrap;gap:10px}
.ba{padding:9px 16px;border-radius:var(--r);font-size:13px;font-weight:600;border:1px solid;display:inline-flex;align-items:center;gap:7px}
.ba-r{background:var(--primary-hl);border-color:var(--primary);color:var(--primary)}
.ba-r:hover{background:var(--primary);color:#fff}
.ba-u{background:var(--success-hl);border-color:var(--success);color:var(--success)}
.ba-u:hover{background:var(--success);color:#fff}
.ba-u:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.ba-f{background:var(--warn-hl);border-color:var(--warn);color:var(--warn)}
.ba-f:hover{background:var(--warn);color:#000}

.glist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gc{padding:3px 10px;border-radius:20px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}

.mov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center}
.mo{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:28px;width:100%;max-width:360px;box-shadow:var(--sh)}
.mo h3{font-size:16px;font-weight:700;margin-bottom:6px}
.mo p{font-size:13px;color:var(--muted);margin-bottom:18px}
.mof{margin-bottom:14px}
.mof label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.mi{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);outline:none;font-size:14px;color:var(--text)}
.mi:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-hl)}
.mobtns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.bcan{padding:9px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600}
.bcan:hover{border-color:var(--primary)}
.bcon{padding:9px 16px;background:var(--primary);color:#fff;border-radius:var(--r);font-size:13px;font-weight:600}
.bcon:hover{background:var(--primary-h)}
.bcon:disabled{opacity:.6;cursor:not-allowed}

.twrap{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:var(--r);font-size:13px;font-weight:500;box-shadow:var(--sh);animation:tIn .2s ease;max-width:340px}
.toast.ok{background:#3ecf8e;color:#fff}
.toast.err{background:#f56565;color:#fff}
@keyframes tIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ═══════════════════════════════════════
   RESPONSIVE — MÓVIL
═══════════════════════════════════════ */

/* Botón hamburguesa (solo móvil) */
.hmbg{display:none;padding:6px;border-radius:var(--r);color:var(--muted);flex-shrink:0}
.hmbg:hover{background:var(--surface2);color:var(--text)}

/* Overlay oscuro cuando sidebar está abierto en móvil */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}

@media(max-width:768px){
  /* ── Header ── */
  .hdr{padding:0 12px;gap:8px}
  .hlogo{font-size:13px}
  .hlogo svg{width:18px;height:18px}
  .husr{display:none}          /* se esconde en móvil, ya sale en el sidebar */
  .hmbg{display:flex}

  /* ── Layout: sidebar deslizable ── */
  .main{position:relative;overflow:visible}
  .sb{
    position:fixed;
    top:52px;left:0;bottom:0;
    width:290px;
    transform:translateX(-100%);
    transition:transform var(--t);
    z-index:50;
    overflow-y:auto;
    box-shadow:var(--sh);
  }
  .sb.open{transform:translateX(0)}
  .sb-overlay.open{display:block}

  /* ── Panel detalle ── */
  .dp{padding:12px;gap:12px}

  /* ── Card usuario ── */
  .uch{padding:14px 16px;gap:12px}
  .uav{width:42px;height:42px;font-size:16px}
  .uim h2{font-size:15px}
  .ucb{padding:14px 16px}
  .dgrid{grid-template-columns:1fr 1fr;gap:10px}
  .strow{padding:10px 16px;gap:6px}

  /* ── Acciones ── */
  .agrid{flex-direction:column}
  .ba{width:100%;justify-content:center}
  .acard{padding:14px 16px}

  /* ── Modales ── */
  .mov{align-items:flex-end}
  .mo{border-radius:var(--rl) var(--rl) 0 0;max-width:100%;width:100%;padding:24px 20px 32px}

  /* ── Login card ── */
  .lcard{border-radius:var(--rl) var(--rl) 0 0;padding:28px 20px 36px;max-width:100%}
  #lo{align-items:flex-end}

  /* ── Toast ── */
  .twrap{bottom:12px;right:12px;left:12px}
  .toast{max-width:100%}

  /* ── Textos ── */
  .slbl{font-size:10px}
  .dtab2{font-size:12px;padding:7px 4px}
}

@media(max-width:400px){
  .dgrid{grid-template-columns:1fr}
  .dtabs{grid-template-columns:1fr 1fr}
}

.bportal{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--muted);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background var(--t),color var(--t),border-color var(--t)}
.bportal:hover{color:var(--text);border-color:var(--primary)}
@media(max-width:768px){.bportal .bptxt{display:none}.bportal{padding:6px 9px}}
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="lo">
 <div class="lcard">
  <div class="llogo">
   <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
    <rect width="38" height="38" rx="10" fill="#1e2330"/>
    <circle cx="19" cy="13" r="5" stroke="#4f8ef7" stroke-width="2"/>
    <path d="M10 30c0-4.97 4.03-9 9-9s9 4.03 9 9" stroke="#4f8ef7" stroke-width="2" stroke-linecap="round"/>
    <path d="M25 22l2.5 2.5L32 20" stroke="#3ecf8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
   </svg>
   <div class="llogo-txt">
    <h1>Gestor Active Directory</h1>
    <p>CJF / OAJ &mdash; Acceso institucional</p>
   </div>
  </div>
  <div id="lerr" class="lerr"></div>
  <div class="dtabs" style="grid-template-columns:1fr 1fr 1fr">
   <button class="dtab on" data-d="cjf" onclick="setLD('cjf')">&#11044; CJF</button>
   <button class="dtab" data-d="oaj" onclick="setLD('oaj')">&#11044; OAJ</button>
   <button class="dtab" data-d="tdj" onclick="setLD('tdj')">&#11044; TDJ</button>
  </div>
  <div class="lf">
   <label>Usuario de red</label>
   <input id="lu" class="li" type="text" placeholder="usuario" autocomplete="username" spellcheck="false">
  </div>
  <div class="lf">
   <label>Contrase&ntilde;a</label>
   <div class="pwrap">
    <input id="lp" class="li" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
    <button class="ptgl" onclick="tpwd('lp',this)" tabindex="-1" type="button">
     <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
   </div>
  </div>
  <button class="lbtn" id="lbtn" onclick="doLogin()">Iniciar sesi&oacute;n</button>
 </div>
</div>

<!-- APP -->
<div id="app">
 <header class="hdr">
  <button class="hmbg" onclick="tgSB()" aria-label="Menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><div class="hlogo">
   <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f8ef7" stroke-width="2">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
   </svg>
   Gestor Active Directory
  </div>
  <a class="bportal" href="/DGTI_Zapopan/" title="Volver al portal DGTI">&larr; <span class="bptxt">Portal DGTI</span></a>
<div class="husr"><span class="udot"></span><span id="husr">&#8212;</span></div>
  <button class="blout" onclick="doLogout()">Cerrar sesi&oacute;n</button>
  <button class="btheme" onclick="tTheme()" title="Cambiar tema">
   <svg id="tico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
   </svg>
  </button>
 </header>
 <div class="main">
  <div class="sb-overlay" id="sb-ov" onclick="tgSB()"></div>
  <aside class="sb" id="sb">
   <div class="sbs">
    <div class="slbl">Dominio</div>
    <div class="dtabs2" style="grid-template-columns:1fr 1fr 1fr">
     <button class="dtab2 on" data-d="cjf" onclick="setDom('cjf')">&#11044; CJF</button>
     <button class="dtab2" data-d="oaj" onclick="setDom('oaj')">&#11044; OAJ</button>
     <button class="dtab2" data-d="tdj" onclick="setDom('tdj')">&#11044; TDJ</button>
    </div>
   </div>
   <div class="sbs">
    <div class="slbl">Buscar usuario</div>
    <div class="swrap">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
     <input id="qi" class="si" type="text" placeholder="Nombre, usuario&hellip;" onkeydown="if(event.key==='Enter')doBus()">
    </div>
    <button class="bbus" id="bbus" onclick="doBus()">
     <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
     Buscar
    </button>
   </div>
   <div class="sbs" id="recsec" style="display:none">
    <div class="slbl">Recientes</div>
    <div class="reclist" id="reclst"></div>
   </div>
   <div id="rlist" class="rlist"></div>
  </aside>
  <main class="dp" id="dp">
   <div class="empty">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
     <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
     <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
    <p>Busca un usuario para ver su informaci&oacute;n</p>
   </div>
  </main>
 </div>
</div>

<!-- Modal reset -->
<div id="mres" class="mov" style="display:none">
 <div class="mo">
  <h3>Restablecer contrase&ntilde;a</h3>
  <p id="mrdesc"></p>
  <div class="mof">
   <label>Nueva contrase&ntilde;a</label>
   <div class="pwrap">
    <input id="np" class="mi" type="password" placeholder="M&iacute;n. 8 caracteres">
    <button class="ptgl" onclick="tpwd('np',this)" tabindex="-1" type="button">
     <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
   </div>
  </div>
  <div class="mobtns">
   <button class="bcan" onclick="cm('mres')">Cancelar</button>
   <button class="bcon" id="bcres" onclick="confRes()">Confirmar</button>
  </div>
 </div>
</div>


<!-- Modal: autenticar segundo dominio -->
<div id="msld" class="mov" style="display:none">
 <div class="mo">
  <h3 id="sld-titulo">Contrase&ntilde;a OAJ</h3>
  <p id="sld-desc">Ingresa tus credenciales para este dominio.</p>
  <div id="sld-err" class="lerr" style="margin-bottom:12px"></div>
  <div class="mof">
   <label>Usuario</label>
   <input id="sld-user" class="mi" type="text" autocomplete="username" spellcheck="false">
  </div>
  <div class="mof">
   <label>Contrase&ntilde;a</label>
   <div class="pwrap">
    <input id="sld-pass" class="mi" type="password">
    <button class="ptgl" onclick="tpwd('sld-pass',this)" tabindex="-1" type="button">
     <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
   </div>
  </div>
  <div class="mobtns">
   <button class="bcan" onclick="cm('msld')">Cancelar</button>
   <button class="bcon" id="bcnsld" onclick="confSLD()">Confirmar</button>
  </div>
 </div>
</div>

<div class="twrap" id="tw"></div>
<script>
var _tok=sessionStorage.getItem('g_tok')||null;
var _dl='cjf', _d='cjf';
var _res=[], _sel=null, _dark=true;
var _rec=JSON.parse(sessionStorage.getItem('g_rec')||'[]');
var _authed=new Set();   // dominios con credenciales activas en esta sesión

/* ── Tema ── */
function tTheme(){_dark=!_dark;document.documentElement.setAttribute('data-theme',_dark?'dark':'light');document.getElementById('tico').innerHTML=_dark?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>':'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';}

/* ── Password toggle ── */
function tpwd(id,btn){var i=document.getElementById(id),s=i.type==='password';i.type=s?'text':'password';btn.innerHTML=s?'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>':'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';}

/* ── API helper ── */
async function api(m,p,b){
  var h={'Content-Type':'application/json'};
  if(_tok)h['Authorization']='Bearer '+_tok;
  var r=await fetch(p,{method:m,headers:h,body:b?JSON.stringify(b):undefined});
  var d=await r.json().catch(()=>({}));
  return{s:r.status,d};
}

/* ── Sesión inicial ── */
async function checkSess(){
  if(!_tok){showLogin();return;}
  var{s,d}=await api('GET','/api/session');
  if(s===200&&d.ok){
    _authed=new Set(d.authed_domains||[d.domain]);
    showApp(d.display,d.domain);
    renderRec();
  }else{
    _tok=null;sessionStorage.removeItem('g_tok');showLogin();
  }
}

function showLogin(){
  document.getElementById('lo').style.display='flex';
  document.getElementById('app').style.display='none';
  setTimeout(()=>document.getElementById('lu').focus(),80);
}

function showApp(disp,dom){
  document.getElementById('lo').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('husr').textContent=disp;
  setD(dom||'cjf');
}

/* ── Login principal ── */
function setLD(d){_dl=d;document.querySelectorAll('.dtab').forEach(t=>t.classList.toggle('on',t.dataset.d===d));}

async function doLogin(){
  var u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;
  var e=document.getElementById('lerr');e.style.display='none';
  if(!u||!p){e.textContent='⚠ Escribe usuario y contraseña';e.style.display='block';return;}
  var b=document.getElementById('lbtn');b.disabled=true;b.innerHTML='<span class="spin"></span> Verificando…';
  var{s,d}=await api('POST','/api/login',{user:u,password:p,dominio:_dl});
  if(s===200&&d.ok){
    _tok=d.token;sessionStorage.setItem('g_tok',_tok);
    _authed=new Set(d.authed_domains||[_dl]);
    document.getElementById('lp').value='';
    showApp(d.display,_dl);renderRec();
  }else{
    e.textContent='⚠ '+(d.error||'Credenciales incorrectas');e.style.display='block';
  }
  b.disabled=false;b.innerHTML='Iniciar sesión';
}

/* ── Logout ── */
async function doLogout(){
  await api('POST','/api/logout');
  _tok=null;sessionStorage.removeItem('g_tok');
  _res=[];_sel=null;_authed=new Set();
  document.getElementById('rlist').innerHTML='';
  document.getElementById('dp').innerHTML=emptyHTML();
  showLogin();
}

function emptyHTML(){return '<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><p>Busca un usuario para ver su información</p></div>';}

/* ── Cambio de dominio ── */
function setD(d){
  _d=d;
  document.querySelectorAll('.dtab2').forEach(t=>t.classList.toggle('on',t.dataset.d===d));
  renderDomBadges();
}

function renderDomBadges(){
  // Marca visual: candado en tabs de dominios no autenticados
  document.querySelectorAll('.dtab2').forEach(t=>{
    var authed=_authed.has(t.dataset.d);
    t.title=authed?'Autenticado':('Requiere contraseña ' + t.dataset.d.toUpperCase());
    t.innerHTML=(authed?'● ':'&#128274; ')+t.dataset.d.toUpperCase();
  });
}

async function setDom(d){
  // Si ya está autenticado, solo cambia
  if(_authed.has(d)){setD(d);return;}
  // Si no, abre modal de segundo login
  _pendingDom=d;
  document.getElementById('sld-titulo').textContent=
    'Contraseña '+d.toUpperCase();
  document.getElementById('sld-desc').textContent=
    'Tu sesión no tiene credenciales para '+d.toUpperCase()+
    '. Ingresa la contraseña de ese dominio para continuar.';
  document.getElementById('sld-user').value=
    document.getElementById('husr').textContent.split('\\').pop();
  document.getElementById('sld-pass').value='';
  document.getElementById('sld-err').style.display='none';
  document.getElementById('msld').style.display='flex';
  setTimeout(()=>document.getElementById('sld-pass').focus(),80);
}

/* ── Login segundo dominio ── */
var _pendingDom=null;

async function confSLD(){
  var user=document.getElementById('sld-user').value.trim();
  var pass=document.getElementById('sld-pass').value;
  var errEl=document.getElementById('sld-err');
  errEl.style.display='none';
  if(!user||!pass){errEl.textContent='⚠ Escribe usuario y contraseña';errEl.style.display='block';return;}
  var b=document.getElementById('bcnsld');b.disabled=true;b.innerHTML='<span class="spin"></span>';
  var{s,d}=await api('POST','/api/login-domain',{dominio:_pendingDom,user,password:pass});
  b.disabled=false;b.innerHTML='Confirmar';
  if(s===200&&d.ok){
    _authed=new Set(d.authed_domains);
    cm('msld');
    setD(_pendingDom);
    toast('✅ Autenticado en '+_pendingDom.toUpperCase(),'ok');
    _pendingDom=null;
  }else{
    errEl.textContent='⚠ '+(d.error||'Credenciales incorrectas');
    errEl.style.display='block';
  }
}

/* ── Recientes ── */
function addRec(q,dom){_rec=_rec.filter(r=>!(r.q===q&&r.d===dom));_rec.unshift({q,d:dom});if(_rec.length>8)_rec.pop();sessionStorage.setItem('g_rec',JSON.stringify(_rec));renderRec();}
function renderRec(){var s=document.getElementById('recsec'),l=document.getElementById('reclst');if(!_rec.length){s.style.display='none';return;}s.style.display='block';l.innerHTML=_rec.map(r=>`<button class="crec" onclick="useRec('${esc(r.q)}','${r.d}')"><span class="cdom ${r.d}">${r.d.toUpperCase()}</span>${esc(r.q)}</button>`).join('');}
function useRec(q,dom){document.getElementById('qi').value=q;setDom(dom).then(()=>doBus());}

/* ── Buscar ── */
async function doBus(){
  var q=document.getElementById('qi').value.trim();if(!q)return;
  var b=document.getElementById('bbus');b.disabled=true;b.innerHTML='<span class="spin"></span> Buscando…';
  var{s,d}=await api('POST','/api/ad/buscar',{query:q,dominio:_d});
  b.disabled=false;b.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg> Buscar';
  if(s===401){doLogout();return;}
  if(s===403&&d.need_auth){
    toast('Necesitas autenticarte en '+d.need_auth.toUpperCase()+' primero','err');
    setDom(d.need_auth);return;
  }
  if(s!==200){toast('❌ '+(d.error||'Error al buscar'),'err');return;}
  if(!d.length){toast('Sin resultados para "'+q+'" en '+_d.toUpperCase(),'err');return;}
  _res=d;_sel=null;addRec(q,_d);renderList();selUser(0);
}

/* ── Lista resultados ── */
function renderList(){document.getElementById('rlist').innerHTML=_res.map((u,i)=>{var h=u.habilitado==='SI',bk=u.bloqueado==='SI';return`<div class="ri" id="ri${i}" onclick="selUser(${i})"><div class="ri-n">${esc(u.DisplayName||(u.Nombre+' '+u.Apellido))}</div><div class="ri-u">${esc(u.Usuario)}</div><div class="ri-b"><span class="badge ${h?'bok':'boff'}">${h?'Habilitado':'Deshabilitado'}</span>${bk?'<span class="badge bwrn">Bloqueado</span>':''}${u.pwd_forzar==='SI'?'<span class="badge bmut">Forzar cambio</span>':''}</div></div>`;}).join('');}

function selUser(i){_sel=i;document.querySelectorAll('.ri').forEach((e,j)=>e.classList.toggle('on',i===j));renderDet(_res[i]);closeSB();}

/* ── Detalle ── */
function renderDet(u){try{
  var ini=((u.Nombre||'?')[0]+(u.Apellido||'?')[0]).toUpperCase();
  var fields=[['ID',u.ID],['Usuario',u.Usuario],['Correo',u.Correo],['Teléfono',u.Telefono],['Cargo',u.Cargo],['Departamento',u.Departamento],['Empresa',u.Empresa],['Oficina',u.Office],['Creado',u.creado],['Último login',u.ultimo_login],['Último cambio pwd',u.pwd_ultimo_cambio],['Intentos fallidos',u.intentos_fallidos]];
  var sts=[{l:'Habilitada',v:u.habilitado,ok:u.habilitado==='SI'},{l:'Bloqueado',v:u.bloqueado,ok:u.bloqueado==='NO'},{l:'Pwd expirada',v:u.pwd_expirada,ok:u.pwd_expirada==='NO'},{l:'Nunca expira',v:u.pwd_nunca_expira,ok:null},{l:'Forzar cambio',v:u.pwd_forzar,ok:u.pwd_forzar==='NO'}];
  var gs=Array.isArray(u.grupos)?u.grupos:(u.grupos?[u.grupos]:[]);
  document.getElementById('dp').innerHTML=`
<div class="ucard">
 <div class="uch"><div class="uav ${_d}">${ini}</div><div class="uim"><h2>${esc(u.Nombre)} ${esc(u.Apellido)}</h2><p>${esc(u.DisplayName||'')}${u.description&&u.description.trim()?' — '+esc(u.description):''}</p></div></div>
 <div class="strow">${sts.map(s=>{var c=s.ok===null?'bmut':(s.ok?'bok':'bwrn');return`<span class="stbadge ${c}">${s.l}: ${s.v||'—'}</span>`;}).join('')}</div>
 <div class="ucb">
  <div class="dgrid">${fields.map(([l,v])=>`<div class="df"><label>${l}</label><div class="dv ${!v?'em':''}">${v?esc(v):'—'}</div></div>`).join('')}</div>
  ${gs.length?`<div style="margin-top:16px"><div class="slbl" style="margin-bottom:8px">Grupos (${gs.length})</div><div class="glist">${gs.map(g=>`<span class="gc">${esc(g)}</span>`).join('')}</div></div>`:''}
  <div style="font-size:11px;color:var(--faint);margin-top:14px;word-break:break-all">${esc(u.dn||'')}</div>
 </div>
</div>
<div class="acard">
 <div class="atit">Acciones</div>
 <div class="agrid">
  <button class="ba ba-r" onclick="openReset()">&#128273; Restablecer contraseña</button>
  <button class="ba ba-u" onclick="doUnlock()" ${u.bloqueado!=='SI'?'disabled title="La cuenta no est\u00e1 bloqueada"':''}>&#128275; Desbloquear cuenta</button>
  <button class="ba ba-f" onclick="doForce()">&#8987; Forzar cambio de contraseña</button>
 </div>
</div>`;

/* ── Acciones ── */
}catch(e){console.error('renderDet error:',e,u);toast('❌ Error al mostrar datos: '+e.message,'err');}
}
function openReset(){var u=_res[_sel];document.getElementById('mrdesc').textContent='Nueva contraseña para: '+(u.DisplayName||u.Usuario);document.getElementById('np').value='';document.getElementById('mres').style.display='flex';setTimeout(()=>document.getElementById('np').focus(),80);}
function cm(id){document.getElementById(id).style.display='none';}

async function confRes(){
  var p=document.getElementById('np').value;
  if(p.length<8){toast('La contraseña debe tener al menos 8 caracteres','err');return;}
  var u=_res[_sel],b=document.getElementById('bcres');b.disabled=true;b.innerHTML='<span class="spin"></span>';
  var{s,d}=await api('POST','/api/ad/reset-password',{dn:u.dn,sam:u.Usuario,nueva_pass:p,dominio:_d});
  b.disabled=false;b.innerHTML='Confirmar';cm('mres');
  if(s===401){doLogout();return;}
  if(s===200&&d.ok)toast('✅ Contraseña restablecida','ok');
  else toast('❌ Error: '+(d.error||''),'err');
}

async function doUnlock(){
  var u=_res[_sel];if(!confirm('¿Desbloquear la cuenta de '+(u.DisplayName||u.Usuario)+'?'))return;
  var{s,d}=await api('POST','/api/ad/desbloquear',{dn:u.dn,dominio:_d});
  if(s===401){doLogout();return;}
  if(s===200&&d.ok){toast('✅ Cuenta desbloqueada','ok');u.bloqueado='NO';renderDet(u);renderList();document.querySelectorAll('.ri')[_sel].classList.add('on');}
  else toast('❌ Error: '+(d.error||''),'err');
}

async function doForce(){
  var u=_res[_sel];if(!confirm('¿Forzar cambio de contraseña para '+(u.DisplayName||u.Usuario)+'?'))return;
  var{s,d}=await api('POST','/api/ad/forzar-cambio',{dn:u.dn,dominio:_d});
  if(s===401){doLogout();return;}
  if(s===200&&d.ok){toast('✅ Se forzará cambio en el próximo login','ok');u.pwd_forzar='SI';renderDet(u);}
  else toast('❌ Error: '+(d.error||''),'err');
}

/* ── Toast ── */
function toast(msg,t){var w=document.getElementById('tw'),el=document.createElement('div');el.className='toast '+(t||'ok');el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),4000);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}


/* ── Sidebar móvil ── */
function tgSB(){
  var sb=document.getElementById('sb');
  var ov=document.getElementById('sb-ov');
  var open=sb.classList.toggle('open');
  ov.classList.toggle('open',open);
}
function closeSB(){
  if(window.innerWidth>768)return;
  document.getElementById('sb').classList.remove('open');
  document.getElementById('sb-ov').classList.remove('open');
}

/* ── Eventos ── */
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('qi').addEventListener('keydown',e=>{if(e.key==='Enter')doBus();});
  document.getElementById('np').addEventListener('keydown',e=>{if(e.key==='Enter')confRes();if(e.key==='Escape')cm('mres');});
  document.getElementById('sld-pass').addEventListener('keydown',e=>{if(e.key==='Enter')confSLD();if(e.key==='Escape')cm('msld');});
  checkSess();
});
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/gestor-ad/sw.js')
    .then(()=>console.log('SW registrado'))
    .catch(e=>console.warn('SW error:',e));
}
</script>
</body>
</html>
